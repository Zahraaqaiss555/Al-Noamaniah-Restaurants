<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>لوحة مندوب التوصيل | مطاعم النعمانية</title>
    
    <!-- Google Fonts: Tajawal -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&display=swap" rel="stylesheet">
    
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin=""/>
    
    <link rel="stylesheet" href="css/style.css">
    <style>
        .driver-dashboard {
            display: flex;
            flex-direction: column;
            height: 100%;
            padding: 16px;
            background: var(--bg-cream);
            position: relative;
        }
        .orders-list {
            flex: 1;
            overflow-y: auto;
            display: grid;
            gap: 16px;
            padding-bottom: 20px;
        }
        .order-card {
            background: var(--card-white);
            border-radius: var(--radius-md);
            padding: 16px;
            box-shadow: var(--shadow-card);
            border-right: 4px solid #3b82f6;
        }
        .order-card.active { border-color: var(--color-success); }
        
        .order-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-weight: bold;
        }
        .btn-action {
            width: 100%;
            padding: 10px;
            border-radius: var(--radius-sm);
            border: none;
            cursor: pointer;
            font-family: inherit;
            font-weight: bold;
            color: white;
            background: #3b82f6;
            margin-top: 10px;
        }
        .btn-finish { background: var(--color-success); }
        .btn-call { background: var(--color-warning); color: #000; margin-bottom: 10px; display: block; text-align: center; text-decoration: none;}
        
        /* Map Modal */
        #mapModal {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 2000;
            display: none;
            flex-direction: column;
        }
        .map-header {
            background: white;
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        #driverMap {
            flex: 1;
            width: 100%;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <header class="main-header" style="display:flex;">
            <div class="header-inner">
                <button class="header-icon-btn" onclick="window.location.href='index.html'"><i class="fas fa-home"></i></button>
                <div class="header-title-logo">
                    <i class="fas fa-motorcycle logo-icon"></i>
                    <span>لوحة المندوب</span>
                </div>
                <button class="header-icon-btn" onclick="authManager.signOut().then(()=>window.location.href='index.html')"><i class="fas fa-sign-out-alt"></i></button>
            </div>
        </header>

        <main class="app-scroll-content">
            <div class="driver-dashboard">
                <h2 style="margin-bottom: 15px;">الطلبات المتاحة (جاهزة للتوصيل)</h2>
                
                <div class="tabs" style="display: flex; gap: 10px; margin-bottom: 15px;">
                    <button id="tabAvailable" class="btn-action" style="background: var(--terracotta);">متاحة <span id="countAvailable">0</span></button>
                    <button id="tabMyOrders" class="btn-action" style="background: #3b82f6;">طلباتي <span id="countMyOrders">0</span></button>
                </div>

                <div id="ordersContainer" class="orders-list">
                    <!-- Loaded via JS -->
                    <p style="text-align: center; color: var(--text-muted);">جاري التحميل...</p>
                </div>
            </div>
        </main>
    </div>

    <!-- Map Modal -->
    <div id="mapModal">
        <div class="map-header">
            <h3>تتبع مسار التوصيل</h3>
            <button onclick="closeMapModal()" style="border:none; background:transparent; font-size:1.5rem; cursor:pointer;"><i class="fas fa-times"></i></button>
        </div>
        <div id="driverMap"></div>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
    
    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>

    <script src="js/firebase-config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/driver.js"></script>
</body>
</html>
