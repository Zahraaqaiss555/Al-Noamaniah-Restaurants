<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="مطاعم النعمانية - التوصيل السريع للمأكولات">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="مطاعم النعمانية">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>مطاعم النعمانية</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #1E1E24;
      overflow: hidden;
    }
    #loading-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(180deg, #D3552D 0%, #C04A26 50%, #8E3218 100%);
      z-index: 99999;
      transition: opacity 0.4s ease-out;
      pointer-events: auto;
    }
    .logo-bubble {
      width: 110px;
      height: 110px;
      background: white;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #C04A26;
      font-size: 2.8rem;
      margin-bottom: 1.5rem;
      box-shadow: 0 15px 35px rgba(0,0,0,0.25);
      animation: pulse 1.2s infinite alternate;
    }
    @keyframes pulse {
      0% { transform: scale(0.94); }
      100% { transform: scale(1.06); }
    }
    .app-name {
      color: white;
      font-size: 2.2rem;
      font-weight: 900;
      font-family: 'Segoe UI', Tahoma, sans-serif;
      margin: 0 0 0.5rem 0;
      text-shadow: 0 4px 15px rgba(0,0,0,0.2);
    }
    .slogan-pill {
      background: rgba(255,255,255,0.2);
      border: 1px solid rgba(255,255,255,0.3);
      border-radius: 50px;
      padding: 0.4rem 1.2rem;
      font-size: 0.9rem;
      font-weight: bold;
      color: white;
      font-family: sans-serif;
    }
    .spinner {
      margin-top: 2rem;
      width: 30px;
      height: 30px;
      border: 3px solid rgba(255,255,255,0.3);
      border-radius: 50%;
      border-top-color: white;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>

  <script>
    function hideLoadingOverlay() {
      var overlay = document.getElementById('loading-overlay');
      if (overlay) {
        overlay.style.opacity = '0';
        overlay.style.pointerEvents = 'none';
        setTimeout(function() {
          if (overlay && overlay.parentNode) {
            overlay.parentNode.removeChild(overlay);
          }
        }, 400);
      }
    }

    window.addEventListener('flutter-first-frame', hideLoadingOverlay);
    setTimeout(hideLoadingOverlay, 1800);
  </script>
</head>
<body>
  <div id="loading-overlay">
    <div class="logo-bubble">
      <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#C04A26" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M18 8h1a4 4 0 0 1 0 8h-1"></path>
        <path d="M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V8z"></path>
        <line x1="6" y1="1" x2="6" y2="4"></line>
        <line x1="10" y1="1" x2="10" y2="4"></line>
        <line x1="14" y1="1" x2="14" y2="4"></line>
      </svg>
    </div>
    <h1 class="app-name">مطاعم النعمانية</h1>
    <div class="slogan-pill">طعم النعمانية الأصيل بين يديك</div>
    <div class="spinner"></div>
  </div>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
